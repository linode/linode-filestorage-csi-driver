[settings]
minimum_release_age = "7d"  # only install versions released more than 7 days ago - https://mise.en.dev/security.html#minimum-release-age

[tools]
go = "1.26.5"
kubectl = "1.36.3"
helm = "4.2.3"
golangci-lint = "2.12.2"
kustomize = "5.8.1"
just = "1.58.0"
yq = "4.53.3"
uv = "latest"
"pipx:linode-cli" = "5.68.0"

[tasks.fmt]
description = "Format Go sources"
run = "just fmt"

[tasks.tidy]
description = "Tidy Go modules"
run = "just tidy"

[tasks.vet]
description = "Run Go vet"
run = "just vet"

[tasks.lint]
description = "Run lint checks"
run = "just lint"

[tasks.test]
description = "Run tests"
run = "just test"

[tasks.cover]
description = "Open HTML coverage report"
run = "just cover"

[tasks.gen-mock]
description = "Regenerate Go mocks"
run = "just gen-mock"

[tasks.build]
description = "Build binary"
run = "just build"

[tasks.image-build]
description = "Build container image"
run = "just docker-build"

[tasks.image-push]
description = "Publish container image"
run = "just docker-publish"

[tasks.helm-lint]
description = "Lint Helm charts"
run = "just helm-lint"

[tasks.update-kustomize]
description = "Render kustomize base from Helm chart"
run = "just update-kustomize"

[tasks.verify-kustomize]
description = "Fail if kustomize base is stale"
run = "just verify-kustomize"

[tasks.release]
description = "Create release artifacts"
run = "just release"

[tasks.ci]
description = "Run CI checks"
run = "just ci"

[tasks.helm-install]
description = "Install Helm charts"
run = "just helm-install"
