# apiToken is required when secretRef is not set.
apiToken: ""

# namespace defaults to kube-system but can be overridden for custom installs.
namespace: kube-system

# kubeletPath can be overridden for alternate Kubernetes distros.
kubeletPath: /var/lib/kubelet

# Linode API base URL used by the controller plugin.
linodeURL: https://api.linode.com

# Linode API version used by the controller plugin.
linodeAPIVersion: v4beta

# secretRef:
#   name: linode-api-token
#   apiTokenRef: token

driver:
  # CSI driver name advertised to Kubernetes.
  name: linodenfs.csi.linode.com

# Access-policy authorization applied to provisioned filesystems.
accessPolicy:
  # space uses only the Storage Space VPC ACL. node additionally maintains
  # each filesystem's per-Linode ACL through CSI publish/unpublish operations.
  mode: space

image:
  # Driver image repository.
  repository: docker.io/linode/linode-filestorage-csi-driver
  # Driver image tag; defaults to Chart.appVersion when empty.
  tag: ""
  # Pull policy for the driver image.
  pullPolicy: IfNotPresent
  # Host kubelet path mounted into the node plugin.
  podsMountDir: /var/lib/kubelet
  # Extra env vars added to both controller and node plugin containers.
  env: []
  # Extra volumes added to both controller and node pods.
  volumes: []
  # Extra volume mounts added to both controller and node plugin containers.
  volumeMounts: []
  # Resource requests for the plugin container.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

sidecars:
  provisioner:
    # CSI provisioner sidecar image.
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: v6.2.0
    pullPolicy: IfNotPresent
    # CSI provisioner operation timeout.
    timeout: 5m
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  attacher:
    # CSI attacher sidecar image.
    repository: registry.k8s.io/sig-storage/csi-attacher
    tag: v4.12.0
    pullPolicy: IfNotPresent
    # CSI attacher operation timeout.
    timeout: 5m
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  resizer:
    # Enable once the driver advertises volume expansion support.
    enabled: false
    # CSI resizer sidecar image.
    repository: registry.k8s.io/sig-storage/csi-resizer
    tag: v2.1.0
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  snapshotter:
    # Enable after snapshot APIs and driver snapshot RPCs are ready.
    enabled: false
    # CSI snapshotter sidecar image.
    repository: registry.k8s.io/sig-storage/csi-snapshotter
    tag: v8.2.0
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  livenessProbe:
    # Liveness probe sidecar image.
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.15.0
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

controller:
  # Deploy the controller Deployment.
  enabled: true
  # Controller replica count.
  replicaCount: 1
  # Whether the controller pod uses host networking.
  hostNetwork: false
  # DNS policy for the controller pod.
  dnsPolicy: Default
  kubeconfig:
    # Mount path for an optional kubeconfig secret.
    mountDir: ""
    # Secret name containing the kubeconfig file.
    secretName: ""
    # Secret key holding the kubeconfig file contents.
    secretKey: ""
  serviceAccount:
    # Create and use a dedicated controller service account.
    enabled: true
    name: csi-linode-nfs-controller
  rbac:
    # Create controller RBAC resources.
    enabled: true
  # Optional node selector for the controller pod.
  nodeSelector: {}
  # Optional affinity for the controller pod.
  affinity: {}
  # Tolerations for the controller pod.
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - effect: NoExecute
      operator: Exists

node:
  # Deploy the node DaemonSet.
  enabled: true
  # Security context for the node plugin container. The default image runs as
  # non-root, but the kubelet hostPath socket requires root to create csi.sock.
  pluginSecurityContext:
    privileged: true
    runAsUser: 0
    runAsGroup: 0
  serviceAccount:
    # Create and use a dedicated node service account.
    enabled: true
    name: csi-linode-nfs-node
  rbac:
    # Create node RBAC resources.
    enabled: true
  registrar:
    # Node driver registrar sidecar image.
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.16.0
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    # Extra env vars for the registrar container.
    env: []
    # Extra volume mounts for the registrar container.
    volumeMounts: []
  livenessProbe:
    # Node liveness probe sidecar image.
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.15.0
    pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

# Extra pod annotations applied to controller and node pods.
podAnnotations: {}
# Extra pod labels applied to controller and node pods.
podLabels: {}
