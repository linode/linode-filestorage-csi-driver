{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-linode-nfs-controller
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app: csi-linode-nfs-controller
  template:
    metadata:
      labels:
        app: csi-linode-nfs-controller
        role: csi-linode
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      hostNetwork: {{ .Values.controller.hostNetwork }}
      dnsPolicy: {{ .Values.controller.dnsPolicy }}
      {{- if .Values.controller.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.controller.serviceAccount.name }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: plugin
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DRIVER_ROLE
              value: controller
            # Keep the controller plugin on its own pod-local socket path so it
            # does not overlap with node plugin socket locations when multiple
            # CSI drivers are installed.
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
            - name: LINODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secretRef }}{{ .Values.secretRef.name }}{{ else }}linode-api-token{{ end }}
                  key: {{ if .Values.secretRef }}{{ default "token" .Values.secretRef.apiTokenRef }}{{ else }}token{{ end }}
            {{- with .Values.image.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.image.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName }}
            - mountPath: {{ .mountDir }}
              name: controller-kubeconfig
              readOnly: true
              {{- end }}
            {{- end }}
            {{- with .Values.image.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - name: csi-provisioner
          image: "{{ .Values.sidecars.provisioner.repository }}:{{ .Values.sidecars.provisioner.tag }}"
          imagePullPolicy: {{ .Values.sidecars.provisioner.pullPolicy }}
          args:
            - --csi-address=/var/lib/csi/sockets/pluginproxy/csi.sock
            - --leader-election
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName .secretKey }}
            - --kubeconfig={{ printf "%s/%s" .mountDir .secretKey }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName }}
            - mountPath: {{ .mountDir }}
              name: controller-kubeconfig
              readOnly: true
              {{- end }}
            {{- end }}
        - name: csi-attacher
          image: "{{ .Values.sidecars.attacher.repository }}:{{ .Values.sidecars.attacher.tag }}"
          imagePullPolicy: {{ .Values.sidecars.attacher.pullPolicy }}
          args:
            - --v=2
            - --csi-address=$(ADDRESS)
            - --leader-election
            - --timeout=30s
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName .secretKey }}
            - --kubeconfig={{ printf "%s/%s" .mountDir .secretKey }}
              {{- end }}
            {{- end }}
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName }}
            - mountPath: {{ .mountDir }}
              name: controller-kubeconfig
              readOnly: true
              {{- end }}
            {{- end }}
        {{- if .Values.sidecars.resizer.enabled }}
        - name: csi-resizer
          image: "{{ .Values.sidecars.resizer.repository }}:{{ .Values.sidecars.resizer.tag }}"
          imagePullPolicy: {{ .Values.sidecars.resizer.pullPolicy }}
          args:
            - --csi-address=/var/lib/csi/sockets/pluginproxy/csi.sock
            - --leader-election
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName .secretKey }}
            - --kubeconfig={{ printf "%s/%s" .mountDir .secretKey }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName }}
            - mountPath: {{ .mountDir }}
              name: controller-kubeconfig
              readOnly: true
              {{- end }}
            {{- end }}
        {{- end }}
        {{- if .Values.sidecars.snapshotter.enabled }}
        - name: csi-snapshotter
          image: "{{ .Values.sidecars.snapshotter.repository }}:{{ .Values.sidecars.snapshotter.tag }}"
          imagePullPolicy: {{ .Values.sidecars.snapshotter.pullPolicy }}
          args:
            - --csi-address=/var/lib/csi/sockets/pluginproxy/csi.sock
            - --leader-election
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName .secretKey }}
            - --kubeconfig={{ printf "%s/%s" .mountDir .secretKey }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            {{- with .Values.controller.kubeconfig }}
              {{- if and .mountDir .secretName }}
            - mountPath: {{ .mountDir }}
              name: controller-kubeconfig
              readOnly: true
              {{- end }}
            {{- end }}
        {{- end }}
        - name: liveness-probe
          image: "{{ .Values.sidecars.livenessProbe.repository }}:{{ .Values.sidecars.livenessProbe.tag }}"
          imagePullPolicy: {{ .Values.sidecars.livenessProbe.pullPolicy }}
          args:
            - --csi-address=/var/lib/csi/sockets/pluginproxy/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- with .Values.controller.kubeconfig }}
          {{- if and .secretName .secretKey }}
        - name: controller-kubeconfig
          secret:
            secretName: {{ .secretName }}
            items:
              - key: {{ .secretKey }}
                path: {{ .secretKey }}
          {{- end }}
        {{- end }}
        {{- with .Values.image.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
