apiVersion: v1
kind: Pod
metadata:
  name: chainsaw-expansion-cleanup
  # Chainsaw injects the namespace; the cleanup catch reapplies this manifest.
  labels:
    e2e.linode.com/test: online-expansion
spec:
  containers:
    - name: cleanup
      image: busybox:1.37.0
      command: [sleep, "86400"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: chainsaw-online-expansion
