---
# Source: linode-nfs-csi-driver/templates/node-daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-linode-nfs-node
spec:
  selector:
    matchLabels:
      app: csi-linode-nfs-node
  template:
    metadata:
      labels:
        app: csi-linode-nfs-node
        role: csi-linode
    spec:
      serviceAccountName: csi-linode-nfs-node
      hostNetwork: true
      containers:
        - name: plugin
          image: "docker.io/linode/linode-filestorage-csi-driver:dev"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsUser: 0
          env:
            - name: DRIVER_ROLE
              value: node
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The node plugin socket stays under /csi in the container, while the
            # kubelet registration path remains unique per driver under kubeletPath
            # to avoid host-side contention with other CSI drivers.
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
        - name: node-driver-registrar
          image: "registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.16.0"
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/linodefs.csi.linode.com/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: "registry.k8s.io/sig-storage/livenessprobe:v2.15.0"
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/csi/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/linodefs.csi.linode.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory

