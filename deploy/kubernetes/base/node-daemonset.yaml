apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: csi-linode-nfs-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: csi-linode-nfs-node
  template:
    metadata:
      labels:
        app: csi-linode-nfs-node
    spec:
      serviceAccountName: csi-linode-nfs-node
      hostNetwork: true
      containers:
        - name: plugin
          image: docker.io/linode/linode-filestorage-csi-driver:dev
          securityContext:
            privileged: true
          env:
            - name: DRIVER_ROLE
              value: node
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The node plugin keeps its in-container socket under /csi, while the
            # kubelet registration path remains unique per driver under the kubelet
            # plugins directory to avoid host-side contention with other CSI drivers.
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
        - name: node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/linodefs.csi.linode.com/csi.sock
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
          args:
            - --csi-address=/csi/csi.sock
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
      volumes:
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/linodefs.csi.linode.com
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory