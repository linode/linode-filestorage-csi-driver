---
# Source: linode-nfs-csi-driver/templates/controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-linode-nfs-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csi-linode-nfs-controller
  template:
    metadata:
      labels:
        app: csi-linode-nfs-controller
        role: csi-linode
    spec:
      hostNetwork: false
      dnsPolicy: Default
      serviceAccountName: csi-linode-nfs-controller
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: plugin
          image: "docker.io/linode/linode-filestorage-csi-driver:dev"
          imagePullPolicy: IfNotPresent
          env:
            - name: DRIVER_ROLE
              value: controller
            # Keep the controller plugin on its own pod-local socket path so it
            # does not overlap with node plugin socket locations when multiple
            # CSI drivers are installed.
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
            - name: NFS_ACCESS_POLICY_MODE
              value: "space"
            - name: LINODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: linode-api-token
                  key: token
            - name: LINODE_URL
              value: "https://api.linode.com"
            - name: LINODE_API_VERSION
              value: "v4beta"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-provisioner
          image: "registry.k8s.io/sig-storage/csi-provisioner:v6.3.0"
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/var/lib/csi/sockets/pluginproxy/csi.sock
            - --leader-election
            - --volume-name-prefix=pvc
            - --volume-name-uuid-length=16
            - --timeout=5m
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: csi-attacher
          image: "registry.k8s.io/sig-storage/csi-attacher:v4.13.0"
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --csi-address=$(ADDRESS)
            - --leader-election
            - --timeout=5m
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
        - name: liveness-probe
          image: "registry.k8s.io/sig-storage/livenessprobe:v2.20.0"
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=/var/lib/csi/sockets/pluginproxy/csi.sock
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
      volumes:
        - name: socket-dir
          emptyDir: {}

