name: Auto Update GH-Pages

on:
  push:
    branches:
      - main

# Serialize runs. Two quick pushes to main would otherwise race between the
# pull and the push below, and the loser fails on a non-fast-forward, leaving
# gh-pages (the docs site and the Helm repo index) stale until the next push.
concurrency:
  group: merge-main-to-gh-pages
  cancel-in-progress: false

jobs:
  merge-main-to-gh-pages:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full clone necessary for proper merge

      - name: Set git config
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Github Actions"

      - name: Merge main into gh-pages
        run: |
          git checkout gh-pages
          git pull
          git merge --no-ff main -m "Automatically merge main into gh-pages"
          git push
