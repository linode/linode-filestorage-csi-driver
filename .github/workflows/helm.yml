name: Helm

on:
  pull_request:
    paths:
      - charts/**
      - deploy/kubernetes/**
      - hack/update-kustomize.sh
      - hack/verify-kustomize.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            get.helm.sh:443
            github.com:443
            pkg.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart
        run: helm lint charts/linode-nfs-csi-driver

      - name: Verify kustomize base is generated from the chart
        run: ./hack/verify-kustomize.sh
