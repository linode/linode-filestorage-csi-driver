name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: go helm ko kustomize just yq
      - name: Create Release Artifacts
        run: mise run release
        env:
          IMAGE_VERSION: ${{ github.ref_name }}
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ./release/helm-chart-${{ github.ref_name }}.tgz
            ./release/linode-filestorage-csi-driver-${{ github.ref_name }}.yaml
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env: 
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_ORG }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image to Docker Hub
        env:
          IMAGE_VERSION: ${{ github.ref_name }}
          IMAGE_TAGS: ${{ github.ref_name }},latest
          KO_DOCKER_REPO: docker.io/linode/linode-filestorage-csi-driver
        run: mise run ko-publish
      - name: Publish image to GHCR
        env:
          IMAGE_VERSION: ${{ github.ref_name }}
          IMAGE_TAGS: ${{ github.ref_name }},latest
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        run: mise run ko-publish
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Publish Helm chart
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_RELEASE_NAME_TEMPLATE: "helm-{{ .Version }}"
        with:
          charts_dir: release/charts
          skip_existing: true
          mark_as_latest: false
